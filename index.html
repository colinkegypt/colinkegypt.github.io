<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colink</title>
<meta name="description" content="Get quotes from service providers across Egypt. Colink connects businesses with manufacturers, printers, agencies and more.">
<style>
:root{--bg:#F3F6FB;--surface:#fff;--ink:#0B1B33;--muted:#55657D;--line:#D5DEEC;--brand:#004AAD;--brand-ink:#fff;--hero:#004AAD;--focus:#0B5BD3;--err:#B3261E;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1424;--surface:#101E35;--ink:#E8EEF8;--muted:#9FB0CB;--line:#22334F;--brand:#5B9BFF;--brand-ink:#001A40;--focus:#9CC0FF;--err:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1424;--surface:#101E35;--ink:#E8EEF8;--muted:#9FB0CB;--line:#22334F;--brand:#5B9BFF;--brand-ink:#001A40;--focus:#9CC0FF;--err:#FF8A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:10}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.top{background:var(--hero);color:#fff;padding-bottom:30px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{height:52px;width:auto;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.lang{background:none;color:#fff;border:1px solid rgba(255,255,255,.65);border-radius:8px;padding:6px 14px;cursor:pointer}
h1{font-size:clamp(28px,6.5vw,44px);line-height:1.15;margin:14px 0 12px;max-width:20ch}
.top p{margin:0 0 22px;color:#DCE7FA;max-width:56ch;font-size:17px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.cta a{background:#fff;color:#004AAD;border-radius:10px;padding:13px 20px;font-weight:700;text-decoration:none}
.cta a.o{background:transparent;color:#fff;border:2px solid #fff}
.chips-t{margin:24px 0 8px;font-size:14px;color:#DCE7FA}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chip{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 13px;font-size:14px;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.26)}
.trust{display:grid;gap:8px;grid-template-columns:1fr 1fr;list-style:none;margin:22px 0 0;padding:0}
@media (max-width:560px){.trust{grid-template-columns:1fr}}
.trust li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.trust li::before{content:"\2713";color:var(--brand);font-weight:700}
section{padding:36px 0 8px}
h2{margin:0 0 6px;font-size:26px}
.sub{color:var(--muted);margin:0 0 20px}
form{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.row{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.row{grid-template-columns:1fr}}
label{display:grid;gap:5px;font-weight:600;font-size:15px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:400;width:100%}
.hp{position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;clip-path:inset(50%)}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;line-height:1.5}
.consent input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--brand)}
.consent a{color:var(--brand);font-weight:600}
.btn{border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:14px 20px;cursor:pointer;font-weight:700;font-size:17px;text-decoration:none;text-align:center;display:inline-block}
.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.note{color:var(--muted);font-size:14px;margin:0}
.err{color:var(--err);font-weight:600;font-size:15px;margin:0}
.done{padding:20px;border:2px solid var(--brand);border-radius:12px;background:var(--surface)}
.done h3{margin:0 0 6px;font-size:20px}
.done p{margin:0 0 14px}
.steps{display:grid;gap:10px;padding:0;margin:0 0 6px;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:2px}
details.legal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 18px}
details.legal summary{cursor:pointer;font-weight:700;font-size:18px;padding:10px 0}
details.legal h3{font-size:16px;margin:18px 0 4px}
details.legal p{margin:0 0 6px;font-size:15px;color:var(--ink)}
details.legal .upd{color:var(--muted);font-size:13px;margin:16px 0 10px}
footer{padding:28px 0 44px;color:var(--muted);font-size:14px;text-align:center}
footer p{margin:0 0 6px}
footer a{color:var(--brand);font-weight:600}
.igwrap{margin:0 0 18px!important}
.btn.ig{display:inline-flex;align-items:center;gap:10px;font-size:16px;padding:12px 20px}
</style>
</head>

var LEGAL={
en:[
["Who we are","Colink is an early-access service that helps businesses in Egypt find service providers. For any question or request about your data, contact {EMAIL}."],
["What we collect","From buyers: name, company, city, phone number, project details, budget and timing. From providers: company, city, main service, Instagram or website link, years in business, team size, a short description, name and phone number. We also record the language of the page and where you came from (for example, which ad), so we know which channels work."],
["Why we use it","To review your submission, contact you, match buyers with suitable providers, and improve the service. Our basis for doing so is your consent, which you give by ticking the box on the form."],
["Who sees it","Buyer requests are shared only with the providers we match to your request. Provider details are shared only with buyers whose requests match your service. We do not publish your business details on any public page without your separate permission. We store submissions with Google (Google Sheets) and host this page with GitHub Pages, so your data may be processed on servers outside Egypt."],
["How long we keep it","Up to {RET} months after our last contact with you, unless you ask us to delete it sooner."],
["Your rights","Under Egypt’s Personal Data Protection Law (Law No. 151 of 2020) you may ask to see, correct or delete your data, and withdraw your consent at any time. Email {EMAIL} and we will act on your request."],
["Early-access terms","Colink introduces buyers and providers. During early access we do not yet verify providers’ documents, and we do not guarantee any quote, price, delivery time or quality. Any agreement is made directly between buyer and provider, so please do your own checks before paying or signing. Colink does not charge fees during early access, and we may change or stop the service at any time."]],
ar:[
["من نحن","كولينك خدمة في مرحلة الوصول المبكر تساعد الشركات في مصر على العثور على مزودي الخدمات. لأي سؤال أو طلب يخص بياناتك، تواصل معنا على {EMAIL}."],
["ما الذي نجمعه","من العملاء: الاسم والشركة والمدينة ورقم الهاتف وتفاصيل المشروع والميزانية والتوقيت. من المزودين: الشركة والمدينة والخدمة الرئيسية ورابط انستجرام أو الموقع وسنوات الخبرة وحجم الفريق ووصف مختصر والاسم ورقم الهاتف. كما نسجّل لغة الصفحة ومصدر وصولك (مثل الإعلان) لنعرف القنوات الأفضل."],
["لماذا نستخدمها","لمراجعة ما ترسله والتواصل معك وربط العملاء بالمزودين المناسبين وتحسين الخدمة. أساس ذلك هو موافقتك التي تمنحها بتحديد المربع في النموذج."],
["من يطّلع عليها","تُشارك طلبات العملاء فقط مع المزودين المناسبين لطلبك. وتُشارك بيانات المزودين فقط مع العملاء الذين تناسب طلباتهم خدمتهم. لا ننشر بيانات نشاطك في أي صفحة عامة دون موافقتك المنفصلة. نحفظ الطلبات لدى Google (جداول Google) ونستضيف هذه الصفحة على GitHub Pages، لذا قد تُعالَج بياناتك على خوادم خارج مصر."],
["مدة الاحتفاظ","حتى {RET} شهرا بعد آخر تواصل بيننا، إلا إذا طلبت حذفها قبل ذلك."],
["حقوقك","بموجب قانون حماية البيانات الشخصية المصري (القانون رقم 151 لسنة 2020) يحق لك طلب الاطلاع على بياناتك أو تصحيحها أو حذفها، وسحب موافقتك في أي وقت. راسلنا على {EMAIL} وسنتعامل مع طلبك."],
["شروط الوصول المبكر","تعرّف كولينك العملاء بالمزودين. في مرحلة الوصول المبكر لا نتحقق بعد من مستندات المزودين، ولا نضمن أي عرض أو سعر أو موعد تسليم أو جودة. أي اتفاق يتم مباشرة بين العميل والمزود، لذا يُرجى إجراء التحقق اللازم قبل الدفع أو التوقيع. لا تفرض كولينك رسوما خلال الوصول المبكر، وقد نغيّر الخدمة أو نوقفها في أي وقت."]]
};
var lang="en",loadedAt=Date.now();
function $(i){return document.getElementById(i)}
function tr(k){return T[lang][k]}
function L(a){return a[lang==="en"?0:1]}
function sub(s){return s.replace("{EMAIL}",CONFIG.EMAIL).replace("{RET}",CONFIG.RETENTION_MONTHS)}
function fill(id,arr,keep){var s=$(id),v=s.selectedIndex;s.innerHTML=arr.map(function(a,i){return '<option value="'+i+'">'+L(a)+'</option>'}).join("");if(keep&&v>0)s.selectedIndex=v}
function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function consent(id,t1){
 var s=$(id);s.textContent="";s.appendChild(document.createTextNode(tr(t1)));
 var a=el("a",tr("cl"));a.href="#privacy";a.addEventListener("click",openPrivacy);s.appendChild(a);
 s.appendChild(document.createTextNode(tr("c2e")));
}
function openPrivacy(){$("privacy").open=true}
function setLang(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==="en"?"ltr":"rtl";
 document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=tr(e.dataset.i)});
 document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=tr(e.dataset.ph)});
 $("lang").textContent=tr("toggle");
 fill("qc",CATS,1);fill("jc",CATS,1);fill("qw",WHEN,1);fill("jy",YRS,1);fill("jt",TEAM,1);
 document.title=lang==="en"?"Colink":"كولينك";
 var ch=$("chips");ch.textContent="";
 CATS.forEach(function(c,i){var li=el("li"),b=el("button",L(c),"chip");b.type="button";b.addEventListener("click",function(){$("qc").selectedIndex=i;$("quote").scrollIntoView();$("qd").focus({preventScroll:true})});li.appendChild(b);ch.appendChild(li)});
 var tl=$("trust");tl.textContent="";tr("trust").forEach(function(t){tl.appendChild(el("li",t))});
 consent("qkt","cq1");consent("jkt","cj1");
 var lb=$("legalBody");lb.textContent="";
 LEGAL[lang].forEach(function(s){lb.appendChild(el("h3",s[0]));lb.appendChild(el("p",sub(s[1])))});
 lb.appendChild(el("p",tr("upd")+" ("+CONFIG.VERSION+")","upd"));
 $("opLine").textContent=sub(tr("op"));
 var cl=$("contactLine");cl.textContent=sub(tr("contact"));
}
var qs=new URLSearchParams(location.search);
function meta(){return{source:qs.get("utm_source")||"",medium:qs.get("utm_medium")||"",campaign:qs.get("utm_campaign")||"",referrer:document.referrer||"",lang:lang,consent:"yes",consentVersion:CONFIG.VERSION,page:location.origin+location.pathname}}
function showErr(box,msg){box.textContent=msg;box.hidden=false}
function thanks(kind,form,box){
 form.hidden=true;box.textContent="";
 box.appendChild(el("h3",tr(kind==="q"?"okQT":"okJT")));
 box.appendChild(el("p",tr(kind==="q"?"okQ":"okJ")));
 var b=el("button",tr("again"),"btn ghost");b.type="button";
 b.addEventListener("click",function(){form.reset();form.hidden=false;box.hidden=true;form.scrollIntoView({block:"start"})});
 box.appendChild(b);box.hidden=false;box.scrollIntoView({block:"center"});
}
function submitForm(kind){
 var q=kind==="q",form=$(q?"qF":"jF"),box=$(q?"qdone":"jdone"),err=$(q?"qerr":"jerr"),btn=form.querySelector("button[type=submit]");
 err.hidden=true;
 var ph=$(q?"qp":"jp"),digits=ph.value.replace(/\D/g,"");
 if(digits.length<10||digits.length>15){showErr(err,tr("errPhone"));ph.focus();return}
 if(form.elements.hp.value||Date.now()-loadedAt<3000){thanks(kind,form,box);return}
 var data=q?{type:"client",need:CATS[$("qc").value][0],details:$("qd").value.trim(),budget:$("qb").value.trim(),timing:WHEN[$("qw").value][0],company:$("qco").value.trim(),city:$("qci").value.trim(),name:$("qn").value.trim(),phone:ph.value.trim()}
  :{type:"provider",company:$("jco").value.trim(),category:CATS[$("jc").value][0],city:$("jci").value.trim(),link:$("jl").value.trim(),years:YRS[$("jy").value][0],team:TEAM[$("jt").value][0],offer:$("jw").value.trim(),name:$("jn").value.trim(),phone:ph.value.trim()};
 var m=meta();for(var k in m)data[k]=m[k];
 if(!CONFIG.ENDPOINT){console.error("Colink: CONFIG.ENDPOINT is empty. Deploy Code.gs and paste the web app URL.");showErr(err,tr("err"));return}
 btn.disabled=true;var old=btn.textContent;btn.textContent=tr("sending");
 var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},20000);
 fetch(CONFIG.ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data),signal:ctl.signal})
 .then(function(){clearTimeout(t);btn.disabled=false;btn.textContent=old;thanks(kind,form,box)})
 .catch(function(){clearTimeout(t);btn.disabled=false;btn.textContent=old;showErr(err,tr("err"))});
}
$("lang").addEventListener("click",function(){lang=lang==="en"?"ar":"en";setLang()});
$("qF").addEventListener("submit",function(e){e.preventDefault();submitForm("q")});
$("jF").addEventListener("submit",function(e){e.preventDefault();submitForm("j")});
window.addEventListener("hashchange",function(){if(location.hash==="#privacy")openPrivacy()});
setLang();
if(location.hash==="#privacy")openPrivacy();
</script>
</body>
</html>
